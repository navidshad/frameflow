name: Release

# Tag-triggered, deliberately. The workflow this replaces fired on every push to
# main, auto-bumped the version, and cut an empty release with no binaries
# attached — which is why it was disabled. Cutting a release is now one local
# command:
#
#   npm version patch && git push --follow-tags
#
# `workflow_dispatch` builds the same matrix without publishing, so the build
# can be exercised without spending a version number.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      # One broken platform should not discard the artefacts of the others.
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            arch: arm64
            args: --mac --arm64
          - name: macOS x64
            os: macos-latest
            arch: x64
            args: --mac --x64
          - name: Windows x64
            os: windows-latest
            arch: x64
            args: --win --x64
          - name: Linux x64
            os: ubuntu-latest
            arch: x64
            args: --linux --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The tag names the release; package.json names the artefacts. If they
      # disagree the release quietly contains files from a different version.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # npm_config_arch is what makes cross-arch builds honest: ffmpeg-static
      # downloads a single binary at install time and picks it from this. The
      # macOS x64 leg runs on an arm64 runner, so without it the x64 app would
      # ship an arm64 ffmpeg that cannot execute. (ffprobe-static ships every
      # arch and is filtered at package time instead — see electron-builder.yml.)
      - name: Install dependencies
        shell: bash
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: npm ci

      # Every macOS signing variable is exported HERE rather than in the build
      # step's `env:`, because an env block cannot conditionally omit a name:
      # a missing secret becomes an empty string, and an empty CSC_LINK is not
      # the same as an absent one. electron-builder reads the variable's
      # presence as "sign with this", resolves "" to the working directory and
      # dies with "<cwd> not a file". So export nothing unless there is
      # something to export.
      - name: Stage macOS signing credentials
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            # Heredoc form: a base64 .p12 may be wrapped across lines, which
            # the plain KEY=value form cannot carry.
            {
              echo "CSC_LINK<<__CSC_EOF__"
              echo "$MAC_CSC_LINK"
              echo "__CSC_EOF__"
              echo "CSC_KEY_PASSWORD<<__PW_EOF__"
              echo "$MAC_CSC_KEY_PASSWORD"
              echo "__PW_EOF__"
            } >> "$GITHUB_ENV"
            echo "Signing certificate staged."
          else
            # Stops electron-builder hunting for an identity in an empty keychain.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing certificate - building UNSIGNED."
          fi

          # electron-builder wants APPLE_API_KEY to be a path to the .p8, not
          # the key itself. No file -> notarization skips itself.
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/authkey.p8"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/authkey.p8"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
            echo "Notarization credentials staged."
          else
            echo "No App Store Connect key - notarization will be skipped."
          fi

      - name: Build and package
        shell: bash
        env:
          # Publish only for a real tag; a manual run just produces artefacts.
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS signing variables are exported by the staging step above, not
          # here -- see the comment on that step for why.

          # --- Windows signing -----------------------------------------------
          # Deliberately absent. Windows artefacts are unsigned and SmartScreen
          # will warn on them. See the win.azureSignOptions block in
          # electron-builder.yml for what fills this in.
        run: |
          npm run build
          npx electron-builder ${{ matrix.args }} --publish "$PUBLISH"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap

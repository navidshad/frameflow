name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Plain `npm ci` on purpose: it runs the same postinstall the app needs
      # (scripts/fetch-ffmpeg.mjs, electron-builder install-app-deps), so CI
      # installs exactly what a developer gets.
      #
      # The install downloads binaries from GitHub releases (Electron, yt-dlp,
      # ffmpeg). When that service answers 5xx the whole run used to fail before
      # a single test: three times in one afternoon, on code that was fine. So a
      # failed install is retried, with a longer wait each time, before it is a
      # real failure.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt of 4). A binary download may have failed; retrying."
            sleep $((attempt * 30))
          done
          exit 1

      # The postinstall already refuses a non-redistributable build, but this
      # states the guarantee in the log rather than leaving it implicit in an
      # install step. Covers this runner's target (linux-x64); the other three
      # are covered per-leg in release.yml and wholesale in ffmpeg-licence.yml.
      - name: Verify FFmpeg licence
        run: npm run verify:ffmpeg

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

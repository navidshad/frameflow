name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Plain `npm ci` on purpose: it runs the same postinstall the app needs
      # (electron-builder install-app-deps, ffmpeg-static binary fetch), so CI
      # installs exactly what a developer gets.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # What the install downloads from GitHub releases (Electron, yt-dlp, and the
      # Linux ffmpeg) is the one thing in this job that is not ours to keep up.
      # When that service answers 5xx the run fails before a single test, on code
      # that is fine: it did, for hours, on the day this was written. So the
      # finished install is cached, and a run that finds it downloads nothing.
      # The key changes with the lockfile, the ffmpeg manifest and the fetch
      # script, so a cache is never older than what it was made from. A run that
      # misses the cache installs as before, and the first one that passes fills it.
      - name: Cache the installed dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/ffmpeg
            ~/.cache/electron
          key: deps-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'scripts/ffmpeg-manifest.json', 'scripts/fetch-ffmpeg.mjs') }}

      # `npm ci` with the install scripts held back, then the ones the build needs
      # run one by one, so that the one download CI has no use for is not among
      # them: yt-dlp's postinstall fetches a binary from GitHub releases, and the
      # tests only ever read its error messages, never run it. An empty file where
      # that binary goes makes the package's own script skip the download. When the
      # release host answers 5xx (it did, for hours, to this runner while a browser
      # could still fetch the same file) that download alone failed every run
      # before a single test. Everything else is what a developer's install does:
      # `npm rebuild` runs the other packages' scripts, then the project's own
      # postinstall (the ffmpeg fetch and electron-builder).
      # A failed install is retried with a longer wait each time, for the short
      # outages; the cache above is for the long ones.
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          install() {
            npm ci --ignore-scripts || return 1
            mkdir -p node_modules/ytdlp-nodejs/bin
            : > node_modules/ytdlp-nodejs/bin/yt-dlp_linux
            npm rebuild || return 1
            node scripts/fetch-ffmpeg.mjs || return 1
            npx electron-builder install-app-deps || return 1
          }
          for attempt in 1 2 3 4; do
            if install; then exit 0; fi
            echo "::warning::The install failed (attempt $attempt of 4). A binary download may have failed; retrying."
            sleep $((attempt * 30))
          done
          exit 1

      # The postinstall already refuses a non-redistributable build, but this
      # states the guarantee in the log rather than leaving it implicit in an
      # install step. Covers this runner's target (linux-x64); the other three
      # are covered per-leg in release.yml and wholesale in ffmpeg-licence.yml.
      - name: Verify FFmpeg licence
        run: npm run verify:ffmpeg

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
